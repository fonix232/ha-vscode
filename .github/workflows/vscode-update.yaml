---
name: Auto-update VS Code version

# Renovate bumps both vscode/Dockerfile and vscode/config.yaml in one PR (see
# .github/renovate.json). This workflow verifies it, adds the changelog entry
# to the PR (VS Code's release highlights plus any unreleased add-on entries,
# see .github/scripts/changelog.js), then merges, releases and builds it.
#
# The changelog commit is authored by github-actions[bot], which is listed in
# renovate.json's gitIgnoredAuthors. Any other author on the Renovate branch
# marks the PR as edited and Renovate stops updating it. When Renovate
# rewrites the branch it drops the commit, and the next run adds it again.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: vscode-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      startsWith(github.head_ref, 'renovate/microsoft-vscode-') &&
      (github.actor == 'renovate[bot]' || github.actor == 'renovate')
    steps:
      # The branch tip rather than the event commit, so a re-run after the
      # changelog commit was pushed picks it up instead of conflicting.
      # Full history for the release tags changelog.js folds entries by.
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify versions
        id: version
        run: |
          vscode=$(sed -n 's/^ARG VSCODE_VERSION="\([^"]*\)"/\1/p' vscode/Dockerfile)
          version=$(sed -n 's/^version: //p' vscode/config.yaml)
          echo "VS Code ${vscode}, add-on ${version}"
          if [[ -z "${vscode}" || "${version}" != "${vscode}.0" ]]; then
            echo "::error::config.yaml version ${version} does not match expected ${vscode}.0"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Wait for checks
        uses: actions/github-script@v9
        with:
          script: |
            // Up to 10 minutes, on Renovate's commit: the changelog commit
            // is pushed with GITHUB_TOKEN, which triggers no workflows.
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            for (let i = 0; ; i++) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: sha, filter: 'latest', per_page: 100,
              });
              const others = runs.filter(cr => cr.name !== context.job);
              const pending = others.filter(cr => cr.status !== 'completed');
              if (pending.length === 0) {
                const failed = others.filter(cr =>
                  !['success', 'skipped', 'neutral'].includes(cr.conclusion));
                if (failed.length > 0) {
                  core.setFailed(`Checks failed: ${failed.map(cr => cr.name).join(', ')}`);
                }
                return;
              }
              if (i >= 30) {
                core.setFailed('Timed out waiting for checks');
                return;
              }
              core.info(`Waiting for ${pending.length} check(s)...`);
              await new Promise(r => setTimeout(r, 20000));
            }

      - name: Add changelog entry
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if node .github/scripts/changelog.js notes "${VERSION}" > /dev/null 2>&1; then
            echo "Changelog already has ${VERSION}"
          else
            node .github/scripts/changelog.js add "${VERSION}"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "docs: changelog for ${VERSION}" -- vscode/CHANGELOG.md
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge, release and build
        uses: actions/github-script@v9
        env:
          SHA: ${{ steps.changelog.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const { SHA: sha, VERSION: version } = process.env;
            const tag = `v${version}`;
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            // 1. Merge. pr.mergeable is computed asynchronously and can be
            // stale, so retry the merge itself on 405. Passing sha guarantees
            // only the verified commit is merged.
            let mergeSha;
            for (let i = 0; !mergeSha; i++) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
              if (pr.merged) {
                mergeSha = pr.merge_commit_sha;
                break;
              }
              if (pr.mergeable === false) {
                core.setFailed('PR is not mergeable (conflicts or branch protection rules)');
                return;
              }
              if (pr.mergeable === true) {
                try {
                  ({ data: { sha: mergeSha } } = await github.rest.pulls.merge({
                    owner, repo, pull_number, sha, merge_method: 'squash',
                  }));
                  break;
                } catch (err) {
                  if (err.status !== 405) throw err;
                  core.info(`Merge rejected: ${err.message}`);
                }
              }
              if (i >= 12) {
                core.setFailed('Timed out trying to merge PR');
                return;
              }
              await sleep(5000);
            }
            core.info(`Merged as ${mergeSha}`);

            // 2. Release (idempotent, so re-runs are safe), with the
            // changelog entry as its notes.
            const changelog = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/changelog.js`);
            const text = require('fs').readFileSync('vscode/CHANGELOG.md', 'utf8');
            try {
              await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: mergeSha,
                name: `VS Code ${version}`,
                body: changelog.section(text, version),
              });
              core.info(`Created release ${tag}`);
            } catch (err) {
              if (err.status !== 422) throw err;
              core.info(`Release ${tag} already exists`);
            }

            // 3. Build. Releases created with GITHUB_TOKEN do not trigger
            // other workflows; workflow_dispatch is exempt from that rule.
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'build.yaml', ref: tag,
            });
            core.info(`Dispatched build.yaml for ${tag}`);
