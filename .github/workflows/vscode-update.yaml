---
name: Auto-update VS Code version

# Renovate bumps both vscode/Dockerfile and vscode/config.yaml in one PR (see
# .github/renovate.json). This workflow verifies, merges, releases and builds
# it. It must never push to the Renovate branch: doing so marks the PR as
# edited and Renovate stops updating it, so the changelog entry (VS Code's
# release highlights plus any unreleased add-on entries, see
# .github/scripts/changelog.js) is committed to main after the merge.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: vscode-update-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      startsWith(github.head_ref, 'renovate/microsoft-vscode-') &&
      (github.actor == 'renovate[bot]' || github.actor == 'renovate')
    steps:
      - name: Checkout changelog script
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Verify, merge, release and build
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            // 1. Verify config.yaml version == Dockerfile VSCODE_VERSION + ".0"
            const read = async path => {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: sha });
              return Buffer.from(data.content, 'base64').toString();
            };
            const [dockerfile, config] = await Promise.all([
              read('vscode/Dockerfile'),
              read('vscode/config.yaml'),
            ]);
            const vscodeVersion = dockerfile.match(/^ARG VSCODE_VERSION="([^"]+)"/m)?.[1];
            const version = config.match(/^version: (\S+)/m)?.[1];
            core.info(`VS Code ${vscodeVersion}, add-on ${version}`);
            if (!vscodeVersion || version !== `${vscodeVersion}.0`) {
              core.setFailed(`config.yaml version ${version} does not match expected ${vscodeVersion}.0`);
              return;
            }
            const tag = `v${version}`;

            // 2. Wait up to 10 minutes for other checks on the head commit
            for (let i = 0; ; i++) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: sha, filter: 'latest', per_page: 100,
              });
              const others = runs.filter(cr => cr.name !== context.job);
              const pending = others.filter(cr => cr.status !== 'completed');
              if (pending.length === 0) {
                const failed = others.filter(cr =>
                  !['success', 'skipped', 'neutral'].includes(cr.conclusion));
                if (failed.length > 0) {
                  core.setFailed(`Checks failed: ${failed.map(cr => cr.name).join(', ')}`);
                  return;
                }
                break;
              }
              if (i >= 30) {
                core.setFailed('Timed out waiting for checks');
                return;
              }
              core.info(`Waiting for ${pending.length} check(s)...`);
              await sleep(20000);
            }

            // 3. Merge. pr.mergeable is computed asynchronously and can be
            // stale, so retry the merge itself on 405. Passing sha guarantees
            // only the verified commit is merged.
            let mergeSha;
            for (let i = 0; !mergeSha; i++) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
              if (pr.merged) {
                mergeSha = pr.merge_commit_sha;
                break;
              }
              if (pr.mergeable === false) {
                core.setFailed('PR is not mergeable (conflicts or branch protection rules)');
                return;
              }
              if (pr.mergeable === true) {
                try {
                  ({ data: { sha: mergeSha } } = await github.rest.pulls.merge({
                    owner, repo, pull_number, sha, merge_method: 'squash',
                  }));
                  break;
                } catch (err) {
                  if (err.status !== 405) throw err;
                  core.info(`Merge rejected: ${err.message}`);
                }
              }
              if (i >= 12) {
                core.setFailed('Timed out trying to merge PR');
                return;
              }
              await sleep(5000);
            }
            core.info(`Merged as ${mergeSha}`);

            // 4. Changelog entry, committed to main on top of the merge. On a
            // re-run the entry already exists and main is released as is.
            const changelog = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/changelog.js`);
            const path = 'vscode/CHANGELOG.md';
            const vscodeNotes = await changelog.vscodeNotes(vscodeVersion);
            const released = new Set(
              (await github.paginate(github.rest.repos.listTags, { owner, repo, per_page: 100 }))
                .map(t => t.name.replace(/^v/, '')));
            let target, text;
            for (let i = 0; !target; i++) {
              const { data: file } = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              const current = Buffer.from(file.content, 'base64').toString();
              const updated = changelog.addRelease(current, version, { vscode: vscodeNotes, released });
              if (updated === null) {
                text = current;
                ({ data: { commit: { sha: target } } } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' }));
                core.info(`Changelog already has ${version}`);
                break;
              }
              try {
                ({ data: { commit: { sha: target } } } = await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path, branch: 'main', sha: file.sha,
                  message: `docs: changelog for ${version}`,
                  content: Buffer.from(updated).toString('base64'),
                }));
                text = updated;
                core.info(`Committed changelog for ${version} as ${target}`);
              } catch (err) {
                // 409: main moved under us; re-read and retry.
                if (err.status !== 409 || i >= 3) throw err;
                await sleep(2000);
              }
            }

            // 5. Release (idempotent, so re-runs are safe)
            try {
              await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: target,
                name: `VS Code ${version}`,
                body: changelog.section(text, version),
              });
              core.info(`Created release ${tag}`);
            } catch (err) {
              if (err.status !== 422) throw err;
              core.info(`Release ${tag} already exists`);
            }

            // 6. Build. Releases created with GITHUB_TOKEN do not trigger
            // other workflows; workflow_dispatch is exempt from that rule.
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'build.yaml', ref: tag,
            });
            core.info(`Dispatched build.yaml for ${tag}`);
